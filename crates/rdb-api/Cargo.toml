[package]
name = "rdb-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rDB embedded API and host (M9): the six kernel modules on wall-clock time, real RocksDB and real rEtcd control"

# M9 architecture §3. The embedder passes `Arc<dyn ConfigStore>`, so there is no config-client or
# config-engine dependency here. The arrow is rdb-* -> config-* (ADR-rdb-0002).
[dependencies]
rdb-core = { workspace = true }
rdb-storage = { workspace = true }
rdb-value = { workspace = true }
config-core = { workspace = true }
tokio = { workspace = true }
# `StreamExt::next` over a `config_core::WatchStream`. Already a workspace dependency.
futures = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
# Facade only; `rdb_dev` installs the JSONL subscriber through `config-log` (ADR-0013).
tracing = { workspace = true }
# A fresh open names its rDB instance with a v4 uuid (M10, arch R3b).
uuid = { workspace = true }

[dev-dependencies]
# `rdb_dev` starts three in-process rEtcd voters on RocksDB.
config-testkit = { workspace = true }
# `rdb_dev --control` talks to an external rEtcd over gRPC (M10 S1-1).
config-client = { workspace = true }
config-log = { workspace = true }
config-log-macros = { workspace = true }
# Paused time (`start_paused`), so a row can assert the exact wait between reload retries
# (PR #38 review F-001).
tokio = { workspace = true, features = ["test-util"] }
# `rdb_dev` reads JSON values with `doc_scenario`'s parser (`#[path]`, S4 A-1). The `Db` parses
# no JSON. `float_roundtrip`: the default parser stores ~1 in 3 decimals 1 ULP off (ADR-rdb-0012
# §3). `serde` for the visitor that refuses a duplicate key; `hex` for `$bytes` output.
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
hex = { workspace = true }
# `rdb_dev blob upload` hashes the whole blob and prints `--sha256` for a resumed publish (S4b).
sha2 = { workspace = true }

[[example]]
name = "rdb_dev"
# Run the example's poller tests under `cargo test -p rdb-api` (the stall-cleared line).
test = true
