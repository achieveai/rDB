[package]
name = "rdb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rDB partition-database contracts and kernel modules (M7): pure, synchronous, no clock, no I/O"

[dependencies]
bytes = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# Facade only. No subscriber is ever installed here (ADR-0013).
tracing = { workspace = true }
# Digests for the replication envelope, the lineage chain and trace checkpoints. Pure Rust,
# no build script, already pinned by the workspace for `config-core`'s state hash. BLAKE3 was
# considered and rejected because its default build compiles assembly through `cc`
# (rdb ADR-0002).
sha2 = { workspace = true }

[dev-dependencies]
config-log = { workspace = true }
config-log-macros = { workspace = true }
hex = { workspace = true }
# A concrete serde format, so the deserialisation seams can be tested end to end.
serde_json = { workspace = true }
