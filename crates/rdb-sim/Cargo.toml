[package]
name = "rdb-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rDB deterministic simulation environment (M7): scheduler, manual clock, controlled network, fake control store, memory storage, trace and replay"

[dependencies]
rdb-core = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
# The canonical trace and the run manifest are JSON. Both are read by DuckDB in failure triage
# (team rules), and a binary trace would need its own reader before anyone could debug anything.
serde_json = { workspace = true }
thiserror = { workspace = true }
# Facade only; the subscriber is installed by `config-log` in test binaries (ADR-0013).
tracing = { workspace = true }

[dev-dependencies]
# `#[retcd_test]` expands to `::config_log::testing::test_span(..)`, so both are needed.
# This is the allowed direction: `rdb-*` may depend on `config-*` (rdb ADR-0002).
config-log = { workspace = true }
config-log-macros = { workspace = true }
# The campaign's evidence artifacts go through `write_evidence`, which stamps the shared envelope
# and disclaimer; nothing in this crate may write a second copy (ruling V-R24, after V-R5/F-R1).
config-testkit = { workspace = true }
# `m9_host_vs_sim` runs one client script through the simulator and through the real host
# (`rdb_api::Db` over `config_testkit::MemStore`) and compares the replies (M9 close-out C1,
# ruling A-R150). Allowed: `deps` forbids only `config-*` -> `rdb-*`; no product crate takes
# rdb-sim.
rdb-api = { workspace = true }
# The script's keys (`keys::root_key`), values (the byte-document envelope) and the decode of the
# simulator's read, by the same functions the host uses.
rdb-value = { workspace = true }
# The runtime `Db::open` takes for its control calls.
tokio = { workspace = true }
